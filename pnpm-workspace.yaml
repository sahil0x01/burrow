packages:
  - apps/*
  - packages/*

catalog:
  "@types/node": ^24
  vite-plus: 1.4.0

# Install scripts run third-party code on this machine, so each one must be decided explicitly.
allowBuilds:
  # These come with dockerode and only add optional native extras (SSH transport, BuildKit).
  # We reach Docker over its local socket, so none of them are needed.
  cpu-features: false
  protobufjs: false
  ssh2: false
  # Comes with drizzle-kit. Its script only re-checks the platform binary, which pnpm
  # already installs as a separate optional package (@esbuild/<platform>).
  esbuild: false
