name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Same Postgres as compose.yaml, for the database tests.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: burrow
          POSTGRES_PASSWORD: burrow
          POSTGRES_DB: burrow
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U burrow -d burrow"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          version-file: package.json
          cache: true
      - run: vp check
      - run: vp run @burrow/db#migrate
      - run: vp test
